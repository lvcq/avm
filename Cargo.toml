[package]
name = "avm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
avm-core = { workspace = true }
avm-vmm = { workspace = true }
avm-hypervisor = { workspace = true }
avm-daemon = { workspace = true }
avm-client = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/hypervisor",
    "crates/vmm",
    "crates/devices",
    "crates/daemon",
    "crates/pool",
    "crates/assist",
    "crates/api",
    "crates/client",
    "panel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
avm-core = { path = "crates/core" }
avm-hypervisor = { path = "crates/hypervisor" }
avm-vmm = { path = "crates/vmm" }
avm-devices = { path = "crates/devices" }
avm-daemon = { path = "crates/daemon" }
avm-pool = { path = "crates/pool" }
avm-assist = { path = "crates/assist" }
avm-api = { path = "crates/api" }
avm-client = { path = "crates/client" }
avm-panel = { path = "panel" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"


vm-memory = { version = "0.16", features = ["backend-mmap"] }
linux-loader = { version = "0.13", features = ["bzimage"] }
# linux-loader 0.12 需要 vm-memory backend-mmap 特性
# thiserror / tokio / axum
acpi_tables = "0.2"
virtio-queue = "0.14"
virtio-bindings = "0.2"
# rutabaga_gfx (git, M9)

[profile.release]
lto = "thin"
codegen-units = 1
