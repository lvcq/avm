<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa3bf"/>
    </marker>
  </defs>
  <rect width="1180" height="760" fill="#0d1117"/>
  <text x="590" y="38" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="bold">avm 程序架构图 · Android x86_64 轻量运行时</text>

  <!-- 客户端层 -->
  <rect x="40" y="70" width="1100" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="95" fill="#7ee787" font-size="14" font-weight="bold">客户端层（M7）</text>
  <rect x="70" y="110" width="200" height="60" rx="8" fill="#21262d" stroke="#388bfd"/>
  <text x="170" y="135" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">avm CLI</text>
  <text x="170" y="155" fill="#8b949e" font-size="11" text-anchor="middle">doctor / list / start / stop</text>
  <rect x="310" y="110" width="200" height="60" rx="8" fill="#21262d" stroke="#a371f7"/>
  <text x="410" y="135" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">NSH 面板 (panel)</text>
  <text x="410" y="155" fill="#8b949e" font-size="11" text-anchor="middle">托盘常驻 · 关闭即隐藏</text>
  <rect x="550" y="110" width="180" height="60" rx="8" fill="#21262d" stroke="#388bfd"/>
  <text x="640" y="135" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">avm-client</text>
  <text x="640" y="155" fill="#8b949e" font-size="11" text-anchor="middle">共用 HTTP 客户端</text>
  <rect x="760" y="110" width="360" height="60" rx="8" fill="#21262d" stroke="#d29922"/>
  <text x="940" y="135" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">外部自动化工具</text>
  <text x="940" y="155" fill="#8b949e" font-size="11" text-anchor="middle">Airtest · Appium · uiautomator2（adb 通道 assist）</text>

  <!-- daemon 层 -->
  <rect x="40" y="230" width="700" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="255" fill="#7ee787" font-size="14" font-weight="bold">avmd 守护进程（M6）</text>
  <rect x="70" y="270" width="150" height="55" rx="8" fill="#21262d" stroke="#f85149"/>
  <text x="145" y="293" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">avm-api (axum)</text>
  <text x="145" y="311" fill="#8b949e" font-size="11" text-anchor="middle">REST /healthz /instances</text>
  <rect x="250" y="270" width="150" height="55" rx="8" fill="#21262d" stroke="#388bfd"/>
  <text x="325" y="293" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">avm-pool</text>
  <text x="325" y="311" fill="#8b949e" font-size="11" text-anchor="middle">实例池 · 租借/归还/快照</text>
  <rect x="430" y="270" width="150" height="55" rx="8" fill="#21262d" stroke="#388bfd"/>
  <text x="505" y="293" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">InstanceRegistry</text>
  <text x="505" y="311" fill="#8b949e" font-size="11" text-anchor="middle">avm-daemon 状态表</text>
  <rect x="70" y="340" width="510" height="55" rx="8" fill="#21262d" stroke="#d29922"/>
  <text x="325" y="363" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">VmInstance × N（avm-vmm）</text>
  <text x="325" y="381" fill="#8b949e" font-size="11" text-anchor="middle">builder · boot(linux-loader) · bus(PCI) · vcpu loop · ACPI 表</text>

  <!-- 设备层 -->
  <rect x="770" y="230" width="370" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="790" y="255" fill="#7ee787" font-size="14" font-weight="bold">设备模型（avm-devices, M2–M4a/M9）</text>
  <g font-size="12" fill="#e6edf3" text-anchor="middle">
    <rect x="790" y="270" width="100" height="40" rx="6" fill="#21262d" stroke="#388bfd"/><text x="840" y="295">virtio-blk</text>
    <rect x="900" y="270" width="100" height="40" rx="6" fill="#21262d" stroke="#388bfd"/><text x="950" y="295">virtio-net</text>
    <rect x="1010" y="270" width="110" height="40" rx="6" fill="#21262d" stroke="#a371f7"/><text x="1065" y="288">virtio-gpu</text><text x="1065" y="302" fill="#8b949e" font-size="10">2D scanout→M9 3D</text>
    <rect x="790" y="320" width="100" height="40" rx="6" fill="#21262d" stroke="#388bfd"/><text x="840" y="345">virtio-input</text>
    <rect x="900" y="320" width="100" height="40" rx="6" fill="#21262d" stroke="#388bfd"/><text x="950" y="345">UART 16550</text>
    <rect x="1010" y="320" width="110" height="40" rx="6" fill="#21262d" stroke="#d29922"/><text x="1065" y="345">BusDevice trait</text>
  </g>
  <text x="955" y="385" fill="#8b949e" font-size="11" text-anchor="middle">virtio-queue / virtio-bindings · M9: rutabaga_gfx + vhost-device-gpu + ash</text>

  <!-- hypervisor 层 -->
  <rect x="40" y="440" width="1100" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="465" fill="#7ee787" font-size="14" font-weight="bold">Hypervisor 抽象层（avm-hypervisor）· Hypervisor / Partition / VcpuExit trait</text>
  <rect x="70" y="480" width="300" height="55" rx="8" fill="#21262d" stroke="#f85149"/>
  <text x="220" y="503" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">WHPX FFI（M0，Windows）</text>
  <text x="220" y="521" fill="#8b949e" font-size="11" text-anchor="middle">WinHvPlatform.dll · 自研，参考 libkrun</text>
  <rect x="400" y="480" width="180" height="55" rx="8" fill="#21262d" stroke="#8b949e"/>
  <text x="490" y="503" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">KVM（M8）</text>
  <text x="490" y="521" fill="#8b949e" font-size="11" text-anchor="middle">Linux</text>
  <rect x="610" y="480" width="180" height="55" rx="8" fill="#21262d" stroke="#8b949e"/>
  <text x="700" y="503" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">HVF（M8）</text>
  <text x="700" y="521" fill="#8b949e" font-size="11" text-anchor="middle">macOS</text>
  <rect x="820" y="480" width="300" height="55" rx="8" fill="#21262d" stroke="#d29922"/>
  <text x="970" y="503" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">rust-vmm 组件</text>
  <text x="970" y="521" fill="#8b949e" font-size="11" text-anchor="middle">vm-memory · linux-loader · acpi_tables</text>

  <!-- core -->
  <rect x="40" y="580" width="1100" height="60" rx="10" fill="#161b22" stroke="#388bfd"/>
  <text x="590" y="608" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">avm-core（全层依赖）</text>
  <text x="590" y="626" fill="#8b949e" font-size="11" text-anchor="middle">AvmError / AvmResult · InstanceConfig · InstanceState</text>

  <!-- guest -->
  <rect x="40" y="670" width="1100" height="60" rx="10" fill="#161b22" stroke="#7ee787"/>
  <text x="590" y="698" fill="#7ee787" font-size="13" text-anchor="middle" font-weight="bold">Guest：Android x86_64（M5，goldfish kernel，含 virtio 驱动 · M9 加 Venus/gfxstream 预构建驱动）</text>
  <text x="590" y="716" fill="#8b949e" font-size="11" text-anchor="middle">串口输出 → UART 设备 · adb :5555 → virtio-net · 渲染 → virtio-gpu</text>

  <!-- arrows -->
  <g stroke="#8fa3bf" stroke-width="1.5" marker-end="url(#arr)" fill="none">
    <line x1="170" y1="170" x2="170" y2="265"/>
    <line x1="410" y1="170" x2="410" y2="265"/>
    <line x1="640" y1="170" x2="640" y2="265"/>
    <line x1="940" y1="170" x2="940" y2="700" stroke-dasharray="6 4"/>
    <line x1="940" y1="410" x2="940" y2="435"/>
    <line x1="325" y1="395" x2="325" y2="435"/>
    <line x1="220" y1="535" x2="220" y2="575"/>
    <line x1="590" y1="640" x2="590" y2="665"/>
  </g>
  <text x="1030" y="430" fill="#d29922" font-size="11">adb :5555</text>
</svg>
